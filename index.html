<!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <h1>🌦️ Weather App</h1>

            <input type="text" id="cityInput" placeholder="Enter city name" onkeyup="debounceWeather()">

            <div id="weatherResult">
                <h2 id="city"></h2>
                <p id="temp"></p>
                <p id="desc"></p>
                <p id="humidity"></p>
                <p id="wind"></p>
            </div>
        </div>

        <script src="work.js"></script>
    </body>

    </html>
